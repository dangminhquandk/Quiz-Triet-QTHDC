<!DOCTYPE html>
<html lang="vi">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Comfortaa:wght@300;400;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>QTHĐC - Kiến Trúc Tri Thức (Dark Mode)</title>
  <style>
    /* --- CẤU HÌNH DARK MODE --- */
    :root {
      /* Màu chữ chính: Trắng pha xanh nhạt cho dịu mắt */
      --primary-text: #e6f1ff; 
      /* Màu điểm nhấn: Cyan sáng hơn để nổi trên nền tối */
      --highlight-cyan: #64ffda;
      /* Màu nền chính: Gradient xanh đen sâu */
      --bg-gradient: linear-gradient(135deg, #0a192f 0%, #112240 100%);
      /* Nền kính: Màu tối bán trong suốt */
      --glass-bg: rgba(23, 42, 69, 0.8);
      /* Viền kính: Viền sáng mờ */
      --glass-border: 1px solid rgba(100, 255, 218, 0.1);
      /* Màu bóng đổ sâu hơn */
      --shadow-color: rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: 'Comfortaa', cursive, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--primary-text);
      padding: 20px;
      margin: 0;
    }

    /* --- PHẦN HEADER --- */
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 900px;
      margin-bottom: 50px; /* Tăng khoảng cách vì đã bỏ con mắt */
      position: relative;
      padding-top: 20px;
    }

    /* Hiệu ứng nền sáng mờ phía sau tiêu đề (Đã giảm độ sáng) */
    .header-container::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 250px;
      /* Gradient sáng nhẹ hơn cho nền tối */
      background: radial-gradient(circle, rgba(100, 255, 218, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      z-index: -1;
      filter: blur(30px);
    }

    .couplet {
      font-family: 'Dancing Script', cursive;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-text);
      text-align: center;
      width: 30%;
      line-height: 1.4;
      /* Bóng chữ nhẹ để tách khỏi nền */
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .couplet.left { transform: rotate(-2deg); }
    .couplet.right { transform: rotate(2deg); }

    .center-title {
      width: 30%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ĐÃ XÓA CSS .eye-symbol */

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3.5rem; /* Tăng kích thước một chút để lấp chỗ trống */
      margin: 0;
      color: var(--primary-text);
      /* Thêm hiệu ứng phát sáng nhẹ cho tiêu đề */
      text-shadow: 0 0 10px rgba(100, 255, 218, 0.3);
    }
    
    .author-name {
      font-family: 'Dancing Script', cursive;
      margin-top: 15px;
      font-size: 1.5rem;
      color: var(--highlight-cyan); /* Đổi màu tên tác giả thành màu điểm nhấn */
      opacity: 0.8;
    }

    /* --- PHẦN CÂU HỎI (DARK GLASS) --- */
    .question {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 30px;
      margin-bottom: 25px;
      border-radius: 20px;
      border: var(--glass-border);
      box-shadow: 0 8px 32px 0 var(--shadow-color);
      width: 100%;
      max-width: 700px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .question:hover {
      transform: translateY(-5px) scale(1.01);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
      border-color: var(--highlight-cyan);
    }

    .question b {
      color: var(--highlight-cyan);
      font-size: 1.1em;
    }

    /* --- INPUT & BUTTONS --- */
    label {
      display: block;
      margin: 12px 0;
      cursor: pointer;
      padding: 12px 15px;
      border-radius: 12px;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    label:hover {
      /* Màu nền hover sáng nhẹ */
      background: rgba(100, 255, 218, 0.1);
      border-color: rgba(100, 255, 218, 0.2);
    }

    button {
      /* Đảo ngược gradient nút để nổi bật trên nền tối */
      background: linear-gradient(135deg, #00a8cc 0%, #005599 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 30px;
      font-family: 'Comfortaa', cursive;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      margin: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: linear-gradient(135deg, #64ffda 0%, #00a8cc 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(100, 255, 218, 0.4);
      color: #0a192f; /* Chữ tối lại khi hover nền sáng */
    }

    /* --- TRẠNG THÁI ĐÚNG/SAI (DARK MODE VERSION) --- */
    .correct { 
      /* Nền xanh tối hơn */
      background-color: rgba(20, 70, 35, 0.6); 
      /* Chữ xanh sáng */
      color: #75b798; 
      border: 1px solid #2c6644; 
    }
    .wrong { 
      /* Nền đỏ tối hơn */
      background-color: rgba(80, 30, 35, 0.6); 
      text-decoration: line-through; 
      /* Chữ đỏ sáng */
      color: #ea868f; 
      border: 1px solid #6a2e34; 
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
        margin-bottom: 30px;
      }
      .couplet, .center-title {
        width: 100%;
        margin-bottom: 25px;
      }
      .couplet.left, .couplet.right {
        transform: none;
        font-size: 1.5rem;
      }
      h1 { font-size: 2.8rem; }
    }
  </style>
</head>
<body>

<div class="header-container">
  <div class="couplet left">
    Biển học<br>
    vô biên<br>
    lấy<br>
    kiên trì<br>
    làm bến
  </div>

  <div class="center-title">
    <h1>QTHĐC</h1>
    <div class="author-name">- Thầy Hữu Giang -</div>
  </div>

  <div class="couplet right">
    Mây xanh<br>
    không lối<br>
    lấy<br>
    chí cả<br>
    dựng lên.
  </div>
</div>

<div id="quiz"></div>

<div style="text-align: center;">
    <button onclick="submitQuiz()">Check VAR</button>
    <button onclick="location.reload()">Làm Nhát Nữa</button>
</div>

<div id="result" style="margin-top: 20px; font-size: 1.4em; font-weight: bold; font-family: 'Dancing Script'; color: var(--highlight-cyan); text-shadow: 0 0 5px rgba(0,0,0,0.5);"></div>

<script src="question_QTHĐC.js"></script>
<script>
// --- LOGIC ĐÃ CẬP NHẬT THEO CẤU TRÚC DỮ LIỆU THỰC TẾ ---

if (typeof window.QUESTIONS === 'undefined') {
    document.getElementById("quiz").innerHTML = "<p style='color:#ea868f; text-align:center'>⚠️ Lỗi: Không tìm thấy dữ liệu. Hãy kiểm tra file question_QTHĐC.js</p>";
} else {
    const dataSrc = window.QUESTIONS;
    // Lấy ngẫu nhiên 20 câu để luyện tập
    const selected = dataSrc.sort(() => 0.5 - Math.random()).slice(0, 100);
    const quizForm = document.getElementById("quiz");

    selected.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      
      // 1. Dùng q.text thay vì q.question
      div.innerHTML = `<b>Câu ${i + 1}:</b> ${q.text}`;

      // 2. Xử lý options là Mảng [] chứ không phải Object {}
      if (Array.isArray(q.options)) {
          q.options.forEach((optText, index) => {
            // optText chính là chuỗi "a. Kỹ năng kỹ thuật", ...
            div.innerHTML += `
              <label id="q${i}_opt_${index}">
                <input type="radio" name="q${i}" value="${index}">
                ${optText} 
              </label>`;
          });
      }

      // Thêm div ẩn để chứa giải thích (sẽ hiện khi chấm điểm)
      div.innerHTML += `<div id="explain_${i}" style="display:none; margin-top:15px; padding:10px; background:rgba(100,255,218,0.1); border-radius:8px; color:#e6f1ff; font-size:0.9em; border-left: 3px solid #64ffda;">
        💡 <b>Giải thích:</b> ${q.explanation || "Không có giải thích chi tiết."}<br>
        📚 <b>Nguồn:</b> ${q.slideRef || "N/A"}
      </div>`;

      quizForm.appendChild(div);
    });

    window.submitQuiz = function() {
      let score = 0;
      selected.forEach((q, i) => {
        // Lấy input người dùng chọn
        const checkedInput = document.querySelector(`input[name="q${i}"]:checked`);
        const userIndex = checkedInput ? parseInt(checkedInput.value) : -1;
        
        // Reset style cũ
        const allLabels = document.querySelectorAll(`input[name="q${i}"]`);
        allLabels.forEach(input => input.parentElement.classList.remove("correct", "wrong"));

        // Logic check đáp án mới:
        // q.correctAnswers là mảng chứa TEXT đáp án đúng (ví dụ ["c. Kỹ năng quan hệ"])
        // Chúng ta so sánh Text của option người dùng chọn với mảng đáp án đúng
        
        let isCorrect = false;
        let correctIndex = -1;

        // Tìm index của đáp án đúng để tô màu
        q.options.forEach((opt, idx) => {
            if (q.correctAnswers.includes(opt)) {
                correctIndex = idx;
            }
        });

        if (userIndex !== -1) {
            const userText = q.options[userIndex];
            // So sánh chuỗi
            if (q.correctAnswers.includes(userText)) {
                score++;
                checkedInput.parentElement.classList.add("correct");
                isCorrect = true;
            } else {
                checkedInput.parentElement.classList.add("wrong");
            }
        }

        // Luôn hiển thị đáp án đúng nếu người dùng làm sai
        if (!isCorrect && correctIndex !== -1) {
             const correctLabel = document.getElementById(`q${i}_opt_${correctIndex}`);
             if (correctLabel) correctLabel.classList.add("correct");
        }

        // HIỂN THỊ GIẢI THÍCH (Active Recall)
          const explainDiv = document.getElementById(`explain_${i}`);
          if (explainDiv) explainDiv.style.display = "block";
      });

      // Hiển thị kết quả chung cuộc
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `Kết quả: ${score}/100 câu.<br>`;
      
      if (score === 100) resultDiv.innerHTML += "A+ thôi còn phải lói gì nứa!!";
      else if (score >= 80) resultDiv.innerHTML += "Phệt thêm nhát nữa nhẻ";
      else resultDiv.innerHTML += "Làm ăn thế này...làm lại nhát!!";
      
      resultDiv.scrollIntoView({ behavior: "smooth" });
    }
}
</script>

</body>
</html>
