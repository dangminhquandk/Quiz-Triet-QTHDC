<!DOCTYPE html>
<html lang="vi">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góc Ôn Triết - Minh Triết</title>
  <style>
  
    :root {
      --bg-warm: #fdfbf7; 
      --accent-gold: #c5a47e; 
      --text-ink: #4a403a; 
      --soft-shadow: rgba(93, 64, 55, 0.08);
      --success-green: #7d9c82; 
      --error-red: #d48c8c; 
      --hover-cream: #f4efe6;
    }

    body {
      font-family: 'Lora', serif; 
      background-color: var(--bg-warm);
      background-image: radial-gradient(#e8e0d5 1px, transparent 1px); 
      background-size: 20px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-ink);
      padding: 60px 20px;
      line-height: 1.6;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 2.5rem;
      color: #8c7b75;
      margin-bottom: 50px;
      text-align: center;
      position: relative;
    }


    h1::after {
      content: "";
      display: block;
      width: 60px;
      height: 3px;
      background: var(--accent-gold);
      margin: 20px auto 0;
      border-radius: 2px;
    }


    .question {
      background: #fff;
      padding: 35px;
      margin-bottom: 30px;
      border: 1px solid rgba(197, 164, 126, 0.3);
      border-radius: 4px;
      box-shadow: 10px 10px 0px rgba(230, 220, 210, 0.5);
      width: 100%;
      max-width: 680px;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }


    .question::before {
      content: "❧";
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 2rem;
      color: #eee5dc;
    }

    .question:hover {
      transform: translateY(-8px);
      box-shadow: 15px 15px 0px rgba(230, 220, 210, 0.7);
      border-color: var(--accent-gold);
    }

    .question b {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: #6d5e56;
      margin-bottom: 20px;
      border-bottom: 1px dashed #e0d0c0;
      padding-bottom: 10px;
    }

    label {
      display: block;
      margin: 10px 0;
      cursor: pointer;
      padding: 12px 15px;
      border-radius: 4px;
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

    label:hover {
      background: var(--hover-cream);
      color: #2c2420;
    }

    input[type="radio"] {
      accent-color: var(--accent-gold);
      margin-right: 10px;
      transform: scale(1.2);
    }

    /* --- BUTTONS--- */
    button {
      background: var(--text-ink);
      color: #fff;
      border: 1px solid var(--text-ink);
      padding: 14px 35px;
      border-radius: 50px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.4s ease;
      margin: 15px;
      letter-spacing: 1px;
    }

    button:hover {
      background: transparent;
      color: var(--text-ink);
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    /* --- TRẠNG THÁI KẾT QUẢ --- */
    
 
    .correct { 
      background-color: rgba(125, 156, 130, 0.15) !important; 
      color: #2f5e3e; 
      border: 1px solid var(--success-green);
      font-weight: 500;
    }
    
    .wrong { 
      background-color: rgba(212, 140, 140, 0.1) !important; 
      text-decoration: line-through; 
      color: #8a4a4a; 
      border: 1px solid var(--error-red);
      opacity: 0.8;
    }
    
    .highlight-correct {
        color: #2f5e3e;
        font-weight: bold;
        position: relative;
    }
    .highlight-correct::after {
        content: " (Chính xác)";
        font-size: 0.8em;
        font-style: italic;
        opacity: 0.8;
    }

    #result {
      margin-top: 40px; 
      padding: 30px;
      border-top: 2px solid var(--accent-gold);
      font-family: 'Playfair Display', serif;
      text-align: center;
      color: var(--text-ink);
    }

  
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .question {
      animation: fadeIn 0.6s ease-out forwards;
    }

    h1 span {
      display: block;
      margin-top: 15px;
      font-size: 0.55em;
      color: #9c8c84;
      font-family: 'Lora', serif;
    }
  </style>
</head>
<body>

<h1>
  HỌC TRIẾT CHO MINH TRIẾT HÉ HÉ HÉ<br>
  <span>
    "Biển học vô biên lấy kiên trì làm bến<br>
    Mây xanh không lối, lấy chí cả dựng lên."<br>
    — Thầy Hữu Giang —
  </span>
</h1>

<div id="quiz"></div>

<div style="text-align: center; margin-top: 20px;">
    <button onclick="submitQuiz()">Check Var</button> 
    <button onclick="location.reload()">Làm Nhát Nữa</button>
</div>

<div id="result"></div>

<script src="questions.js"></script>

<script>
const quizForm = document.getElementById("quiz");

if (typeof questions === 'undefined') {
    quizForm.innerHTML = "<p style='color:var(--error-red); text-align:center;'>Lỗi: Không tìm thấy dữ liệu câu hỏi (questions.js)</p>";
} else {

    const selected = questions
      .sort(() => 0.5 - Math.random())
      .slice(0, 20);

    selected.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      
      div.innerHTML = `<b>Câu ${i + 1}:</b> ${q.question}`;

      q.options.forEach((opt, idx) => {
        div.innerHTML += `
          <label id="q${i}_opt${idx}">
            <input type="radio" name="q${i}" value="${idx}">
            ${opt}
          </label>`;
      });

      quizForm.appendChild(div);
    });

  
    function submitQuiz() {
      let score = 0;

      selected.forEach((q, i) => {
        const inputs = document.querySelectorAll(`input[name="q${i}"]`);
        const checked = document.querySelector(`input[name="q${i}"]:checked`);
        const checkedVal = checked ? parseInt(checked.value) : -1;

        inputs.forEach((input) => {
             input.parentElement.classList.remove("correct", "wrong");
        });

        const correctIndex = q.correctAnswer;

        if (checkedVal === correctIndex) {
            score++;
            checked.parentElement.classList.add("correct");
        } else {
            if (checked) {
                checked.parentElement.classList.add("wrong");
            }
            const correctLabel = document.getElementById(`q${i}_opt${correctIndex}`);
            if (correctLabel) {
                correctLabel.classList.add("correct"); 
            }
        }
      });

      const resultDiv = document.getElementById("result");
  
      resultDiv.innerHTML = `<span style="font-size: 2rem; display:block; margin-bottom:10px;">${score}/20</span>`;
      
      if (score === 20) resultDiv.innerHTML += "Xứng đáng có 100 'MINH TRIẾT'";
      else if (score >= 15) resultDiv.innerHTML += "Được đấy, cố gắng lên chút nữa nào em.";
      else resultDiv.innerHTML += "Học hành này sao dạy được Minh. Làm lại nhát nữa nào hé hé hé.";
      
      resultDiv.scrollIntoView({ behavior: "smooth" });
    }
}
</script>

</body>
</html>
