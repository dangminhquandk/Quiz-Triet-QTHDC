<!DOCTYPE html>
<html lang="vi">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>ÔN TRIẾT - MINH TRIẾT</title>
  <style>
    body {
      font-family: 'Playfair Display', serif;
      background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #5d4037;
      padding: 40px 20px;
    }

    h1 {
      font-style: italic;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 40px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      text-align: center;
    }

    .question {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(5px);
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 600px;
      transition: transform 0.3s ease;
    }

    .question:hover {
      transform: translateY(-5px);
    }

    label {
      display: block;
      margin: 12px 0;
      cursor: pointer;
      padding: 10px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    label:hover {
      background: rgba(210, 180, 140, 0.2);
    }

    button {
      background: #8e735b;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      margin: 10px;
      box-shadow: 0 4px 15px rgba(142, 115, 91, 0.3);
    }

    button:hover {
      background: #705a46;
      letter-spacing: 1px;
    }

    .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .wrong { background-color: #f8d7da; text-decoration: line-through; color: #721c24; border: 1px solid #f5c6cb; }

    .highlight-correct {
        color: #155724;
        font-weight: bold;
        text-decoration: underline;
    }
  </style>
</head>
<body>

<h1>
  HỌC TRIẾT CHO MINH TRIẾT HÉ HÉ HÉ<br>
  <span style="font-size: 0.6em">
    "Biển học vô biên lấy kiên trì làm bến<br>
    Mây xanh không lối, lấy chí cả dựng lên."<br>
              Thầy Hữu Giang
  </span>
</h1>


<div id="quiz"></div>

<div style="text-align: center;">
    <button onclick="submitQuiz()">CHECK VAR</button>
    <button onclick="location.reload()">LÀM NHÁT NỮA</button>
</div>

<div id="result" style="margin-top: 20px; font-size: 1.2em; font-weight: bold;"></div>

<script src="questions.js"></script>

<script>

const quizForm = document.getElementById("quiz");


if (typeof questions === 'undefined') {
    quizForm.innerHTML = "<p style='color:red'>Lỗi: Không tìm thấy dữ liệu câu hỏi. Hãy chắc chắn file questions.js nằm cùng thư mục.</p>";
} else {

    const selected = questions
      .sort(() => 0.5 - Math.random())
      .slice(0, 20);


    selected.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
   
      div.innerHTML = `<b>Câu ${i + 1}:</b> ${q.question}`;

      q.options.forEach((opt, idx) => {
        div.innerHTML += `
          <label id="q${i}_opt${idx}">
            <input type="radio" name="q${i}" value="${idx}">
            ${opt}
          </label>`;
      });

      quizForm.appendChild(div);
    });


    function submitQuiz() {
      let score = 0;

      selected.forEach((q, i) => {
        const inputs = document.querySelectorAll(`input[name="q${i}"]`);
        const checked = document.querySelector(`input[name="q${i}"]:checked`);
        const checkedVal = checked ? parseInt(checked.value) : -1;


        inputs.forEach((input) => {
             input.parentElement.classList.remove("correct", "wrong");
        });

     
        const correctIndex = q.correctAnswer;


        if (checkedVal === correctIndex) {
            // Đúng
            score++;
            checked.parentElement.classList.add("correct");
        } else {
   
            if (checked) {
                checked.parentElement.classList.add("wrong");
            }
     
            const correctLabel = document.getElementById(`q${i}_opt${correctIndex}`);
            if (correctLabel) {
                correctLabel.classList.add("correct"); 
            }
        }
      });


      const resultDiv = document.getElementById("result");
      resultDiv.innerText = `Kết quả: ${score}/20 câu đúng.`;
      
      if (score === 20) resultDiv.innerText += " Quá ghê gớm! 10 điểm về chỗ.";
      else if (score >= 15) resultDiv.innerText += " Cố gắng lên hehehe";
      else resultDiv.innerText += " Học hành kiểu jz, làm lại nhát nữa nào hé hé hé.";
      

      resultDiv.scrollIntoView({ behavior: "smooth" });
    }
}
</script>

</body>
</html>
